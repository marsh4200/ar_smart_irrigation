run_now:
  name: Run now
  description: Start watering immediately.
  fields:
    zone:
      name: Zone
      description: Zone number to run. Leave empty to run all configured zones in sequence.
      required: false
      selector:
        number:
          min: 1
          max: 4
          mode: box
    check_weather:
      name: Check weather first
      description: Skip the run if it is wet, freezing, or rain is forecast.
      required: false
      default: false
      selector:
        boolean:

stop:
  name: Stop
  description: Cancel any run in progress and switch all zone relays off.
